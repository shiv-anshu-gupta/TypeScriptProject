<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@600;700;800&family=Kalam:wght@700&display=block">
<style>
  /* sKirana palette: ocean teal ground, marigold accent, terracotta, cream paper */
  :root {
    --teal-deep: #2b4750;
    --teal: #3c5a64;
    --teal-lift: #4f7682;
    --marigold: #f4b042;
    --marigold-deep: #e09a28;
    --terracotta: #c0492f;
    --cream: #fdf8ea;
    --ink: #1f2a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 736px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Mukta", "Nirmala UI", sans-serif;
    color: #fff;
    background:
      radial-gradient(rgba(255,255,255,.055) 1.6px, transparent 1.8px) 0 0 / 30px 30px,
      radial-gradient(circle at 74% 58%, rgba(98,140,152,.55) 0%, rgba(98,140,152,0) 46%),
      linear-gradient(118deg, var(--teal-deep) 0%, var(--teal) 52%, #355561 100%);
  }

  svg.art { position: absolute; inset: 0; }

  .copy {
    position: absolute;
    left: 78px; top: 0; bottom: 0; width: 820px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 30px;
  }

  .badge {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--marigold);
    color: #2a1d10;
    font-weight: 800; font-size: 40px; line-height: 1;
    padding: 14px 30px 12px 22px;
    border-radius: 999px;
    box-shadow: 0 6px 0 rgba(0,0,0,.14);
  }
  .badge svg { width: 34px; height: 34px; }

  h1 {
    font-family: "Baloo 2", "Nirmala UI", sans-serif;
    font-weight: 800;
    font-size: 118px;
    line-height: 1.0;
    letter-spacing: -1px;
    text-shadow: 0 5px 0 rgba(0,0,0,.14);
  }
  h1 .hl { color: var(--marigold); display: block; }

  .steps { display: flex; align-items: flex-start; gap: 6px; }
  .step {
    width: 168px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .dot {
    width: 90px; height: 90px; border-radius: 50%;
    display: grid; place-items: center;
    background: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.16);
  }
  .dot svg { width: 44px; height: 44px; }
  .dot .rupee {
    font-family: "Baloo 2", sans-serif; font-weight: 800;
    font-size: 54px; line-height: 1; color: var(--teal); margin-top: 6px;
  }
  .step.goal .dot { background: var(--marigold); }
  .step span {
    font-weight: 800; font-size: 40px; line-height: 1; white-space: nowrap;
  }
  .arrow { width: 34px; height: 90px; display: grid; place-items: center; }
  .arrow svg { width: 34px; height: 34px; }

  .hint {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 18px;
    padding: 10px 32px 10px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.26);
    font-weight: 700; font-size: 38px; line-height: 1;
  }
  .fab {
    width: 62px; height: 62px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--teal-deep);
    border: 4px solid #fff;
  }
  .fab svg { width: 30px; height: 30px; }
</style>
</head>

<div class="copy">

</body>
</html>
