site_name: sKirana
site_description: A customer sends a grocery list to one shop; the shop prices it; the customer collects and pays. How it is built.
site_url: ""
use_directory_urls: true
docs_dir: docs
site_dir: docs-site

# These are source material for the site's own pages, or build outputs.
# Source material and build outputs, not pages.
# README.md is GitHub's front page for docs/; index.md is the site's.
exclude_docs: |
  .typedoc/
  reference/.gitignore
  tools/
  README.md
  SUMMARY.md

# A broken link is a build failure, not something a reader discovers.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  font: false # never fetch fonts at build time; the site must work offline
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path # breadcrumbs: the reference has hundreds of pages
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/brightness-4, name: Light mode }

repo_url: https://github.com/shiv-anshu-gupta/TypeScriptProject
repo_name: sKirana

plugins:
  - search:
      lang: en
      # Split on dots, slashes and underscores too, so pasting
      # `grocery-list.routes.ts` or `MAX_ITEMS_PER_LIST` finds the page.
      separator: '[\s\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shiv-anshu-gupta/TypeScriptProject
