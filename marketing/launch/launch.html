<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>sKirana — teaser and launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;600;700;800&family=Kalam:wght@700&display=block">
<style>
/* ───────────────────────────────────────────────────────────────
   Two square posts, 1080x1080, to go out a day apart.

   1 · TEASER - put up today. Says something is coming and deliberately
       does not say what the app is called or where to get it. There is
       nothing to install yet, so a QR here would waste the one thing a
       teaser has: the question it leaves open.
   2 · LIVE   - put up tomorrow. Answers it, and carries the QR.

   Both are one flat colour, heavy white type set left, and a phone
   cropped by the edge of the frame. Nothing else: the reference that
   works does nothing else either.
   ─────────────────────────────────────────────────────────────── */
:root{
  --sand:#F0F4EC; --ink:#1f2a2e; --ocean:#3c5a64; --sandtint:#efe7d8;
  --accent:#dde8e7; --border:#e6dcc9; --mutedfg:#6f6857;
  --terracotta:#c0492f;
  --paper:#fdf8ea; --paperrow:#fdfbf7; --rule:#c9d9ea; --penink:#26303a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#2a2a2a;font-family:"Mukta","Nirmala UI",sans-serif}

.post{position:relative;width:1080px;height:1080px;overflow:hidden;display:flex}
.pad{position:relative;z-index:3;padding:72px;display:flex;flex-direction:column;width:62%}

/* the faint line pattern both posts share */
.net{position:absolute;inset:0;opacity:.14;z-index:1;
  background-image:
    repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 116px),
    repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 116px);}

/* ── brand row ──────────────────────────────────────────────── */
.brand{display:flex;align-items:center;gap:16px}
.brand .mark{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:34px;line-height:1}
.brand .name{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:38px}

h1{font-family:"Baloo 2","Nirmala UI",sans-serif;font-weight:800;
  font-size:96px;line-height:1.02;letter-spacing:-.015em;margin-top:auto}
.sub{font-size:33px;font-weight:600;line-height:1.42;margin-top:26px}

/* the phone, cropped by the right edge */
.device{position:absolute;z-index:2;right:-74px;top:120px;width:470px;
  border-radius:58px;padding:16px 14px 22px;
  transform:rotate(-7deg);
}
.device .screen{border-radius:46px;overflow:hidden;background:var(--sand)}
.appbar{background:var(--ocean);color:#fff;padding:20px 22px;font-weight:700;font-size:23px;text-align:left}
.paper{background:var(--paper);margin:18px;border-radius:12px;overflow:hidden}
.paper .pr{display:flex;align-items:center;height:52px;border-bottom:2px solid var(--rule);background:#fff}
.paper .pr:nth-child(odd){background:var(--paperrow)}
.paper .n{width:40px;text-align:center;font-size:17px;color:#a89b78}
.paper .it{flex:2.4;padding:0 14px;margin-left:9px;border-left:2px solid rgba(217,168,155,.6);
  font-family:"Kalam",cursive;font-weight:700;font-size:26px;color:var(--penink)}
.paper .qt{flex:1.3;text-align:center;border-left:2px solid rgba(201,217,234,.5);
  font-weight:800;font-size:23px;color:var(--ocean)}
.total{display:flex;justify-content:space-between;padding:18px 22px;background:var(--accent);
  font-weight:800;font-size:25px;color:var(--ocean)}

/* ════════════ 1 · TEASER ════════════ */
.teaser{background:var(--terracotta);color:#fff}
.teaser .brand .mark{background:#fff;color:var(--terracotta)}
.teaser .when{
  display:inline-flex;align-items:center;gap:14px;align-self:flex-start;
  background:rgba(0,0,0,.28);border:3px solid rgba(255,255,255,.45);
  border-radius:999px;padding:16px 34px;font-weight:800;font-size:31px;margin-top:38px;
}
.teaser .sub{color:#ffdfd6}
/* under wraps: the phone is there, but only as a shape */
.teaser .device{background:#8e3421;box-shadow:0 40px 90px rgba(0,0,0,.42)}
.teaser .device .screen{background:#a83d27;height:860px;position:relative}
.teaser .device .screen::after{
  content:"?";position:absolute;inset:0;display:grid;place-items:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:300px;color:rgba(255,255,255,.17);
}

/* ════════════ 2 · LIVE ════════════ */
.live{background:var(--ocean);color:#fff}
.live .brand .mark{background:#fff;color:var(--ocean)}
.live .sub{color:#c3d4d2}
.live h1 em{font-style:normal;color:#ffd9ce}
/* Pulled in from the edge and turned less: the point of this post is the
   prices, and at the teaser's crop the rupee column fell off the frame. */
.live .device{
  background:#0c1416;border:3px solid #31444a;box-shadow:0 44px 96px rgba(0,0,0,.5);
  right:-26px;top:148px;width:430px;transform:rotate(-6deg);
}
.live .get{display:flex;align-items:center;gap:22px;margin-top:40px}
.live .qr{width:148px;height:148px;background:#fff;border-radius:18px;padding:10px;flex:none}
.live .qr svg{width:100%;height:100%;display:block}
.live .store{display:inline-flex;align-items:center;gap:14px;background:#fff;color:var(--ink);
  border-radius:999px;padding:18px 34px;font-weight:800;font-size:28px}
.live .store svg{width:30px;height:30px}
.live .getwords{font-size:25px;font-weight:600;color:#c3d4d2;margin-top:12px;line-height:1.35}
</style>
</head>
<body>

<!-- ══════════ 1 · TEASER — goes up today ══════════ -->
<section class="post teaser">
  <div class="net"></div>
  <div class="pad">
    <div class="brand"><div class="mark">s</div><div class="name">sKirana</div></div>
    <h1>कल से<br>लाइन में<br>लगना बंद</h1>
    <p class="sub">आपकी अपनी दुकान में<br>कुछ नया आ रहा है।</p>
    <div class="when">कल, दुकान पर पूछिए</div>
  </div>
  <div class="device"><div class="screen"></div></div>
</section>

<!-- ══════════ 2 · LIVE — goes up tomorrow ══════════ -->
<section class="post live">
  <div class="net"></div>
  <div class="pad">
    <div class="brand"><div class="mark">s</div><div class="name">sKirana</div></div>
    <h1>अब <em>live</em> है<br>Play Store<br>पर</h1>
    <p class="sub">सूची भेजिए — दाम हम भेजेंगे।<br>आकर ले जाइए।</p>
    <div class="get">
      <div class="qr" id="qr"></div>
      <div>
        <div class="store">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1f2a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
          Google Play
        </div>
        <div class="getwords">scan कीजिए, या<br>Play Store में sKirana ढूँढिए</div>
      </div>
    </div>
  </div>
  <div class="device">
    <div class="screen">
      <div class="appbar">दाम आ गए</div>
      <div class="paper">
        <div class="pr"><span class="n">1</span><span class="it">आटा</span><span class="qt">₹240</span></div>
        <div class="pr"><span class="n">2</span><span class="it">चीनी</span><span class="qt">₹92</span></div>
        <div class="pr"><span class="n">3</span><span class="it">चाय</span><span class="qt">₹135</span></div>
        <div class="pr"><span class="n">4</span><span class="it">तेल</span><span class="qt">₹190</span></div>
      </div>
      <div class="total"><span>कुल</span><span>₹657</span></div>
    </div>
  </div>
</section>

<script>
  fetch("../poster/qr.svg").then((r) => r.text()).then((svg) => {
    document.getElementById("qr").innerHTML = svg;
  }).catch(() => {});
</script>
</body>
</html>
